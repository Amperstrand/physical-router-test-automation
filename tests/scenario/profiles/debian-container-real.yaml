# debian-container-real — PRTA virtual-lab QEMU path: the Debian container
# client (10.99.99.100, wired on br-lan) pays the OpenWrt gateway
# (10.99.99.1) by submitting the staged token at the backend API
# (token_paste actor). Mint: the host fakewallet (10.99.99.2:8383).
client:
  driver: debian_container
  ssh: "ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null debian@10.99.99.100"
payment:
  actor: token_paste
  sats: 4
gateway:
  driver: http_module
  base: "http://10.99.99.1:2121"
  token_source: fakewallet
phases:
  renewal: false
  drain_and_fallback: false
  wallet_fresh: drained

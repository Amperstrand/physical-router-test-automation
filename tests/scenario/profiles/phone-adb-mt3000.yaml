# phone-adb-mt3000 — finale rig: physical phone (adb; serial from
# PHONE_SERIAL env when empty here) pays the MT3000-backed gateway
# through the TIP-03 captive portal. Video evidence via PRTA's
# EvidenceRecorder. Mint: the bench fakewallet (192.168.13.221:8383).
client:
  driver: phone_adb
  serial: ""
payment:
  actor: portal_tip03
  portal: "http://192.168.1.1:2050/"
  timeout_s: 90
  sats: 4
gateway:
  driver: http_module
  base: "http://192.168.1.1:2121"
  token_source: fakewallet
  mint_url: "http://192.168.13.221:8383"
capture:
  driver: evidence_recorder
  serial: ""
phases:
  renewal: true
  drain_and_fallback: false
  wallet_fresh: drained

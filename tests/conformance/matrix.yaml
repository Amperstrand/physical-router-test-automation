# Conformance Matrix — the fault-injection invariant set (R12, tmbr #15)
#
# Machine-readable spec: every scenario × backend executes under identical
# conditions (fault proxy in front of the mint), and the runner asserts the
# seven invariants per scenario. The differential report is generated from
# these results — parity is measured, not asserted.
#
# Invariants (asserted per scenario, numbered for report keys):
#   I1 no_funds_disappear      mint ledger Δ == wallet Δ + paid-out value
#   I2 no_double_count         one payment ⇒ at most one session/grant
#   I3 no_output_reuse         mint observes each blinded-message set once
#   I4 service_or_refund       session granted OR refund/credit recorded durably
#   I5 operator_spendable      no proofs stuck Reserved beyond bounded time
#   I6 retries_preserve_state  duplicate/concurrent retry never corrupt wallet
#   I7 restart_converges       bounded reconciliation to a valid state
#
# Status values a backend scenario may carry:
#   pass | fail | invariant-violated:<n> | skipped:<reason> | pending-venue
#
# venue: host = the v1 runner (binary + cdk-mintd on the host, fault proxy
# in front); qemu = full-VM lane (PRTA virtual lab); the spec carries both;
# the runner executes what its venue supports and marks the rest
# pending-venue rather than lying.

version: 1
invariants:
  - key: no_funds_disappear
    id: I1
    assertion: "mint-side ledger delta == wallet-side balance delta + value provably paid out"
  - key: no_double_count
    id: I2
    assertion: "one payment event produces at most one session/grant across retries, replays, and restarts"
  - key: no_output_reuse
    id: I3
    assertion: "the mint observes each deterministic blinded-message set at most once (no derivation replay)"
  - key: service_or_refund
    id: I4
    assertion: "customer value moved ⇒ session granted OR refund token / durable credit recorded"
  - key: operator_spendable
    id: I5
    assertion: "no proofs remain Reserved/stuck beyond the documented recovery bound"
  - key: retries_preserve_state
    id: I6
    assertion: "sequential + concurrent duplicate submissions leave wallet state valid"
  - key: restart_converges
    id: I7
    assertion: "after restart, reconciliation reaches a valid state within the documented bound"

scenarios:

  # ── payment crash windows ────────────────────────────────────────────
  - id: pay-kill-pre-receive
    desc: "POST / → kill the backend after the intent record but before receive reaches the mint → restart"
    fault: none
    kill_at: pre_receive
    invariants: [I1, I2, I4, I7]
    venue: {host: yes, qemu: yes}
  - id: pay-kill-post-receive-pre-session
    subset: fast
    desc: "kill after receive Ok, before the session is durable → restart"
    fault: none
    kill_at: post_receive
    invariants: [I1, I4, I7]
    venue: {host: yes, qemu: yes}
  - id: pay-kill-post-session-pre-gate
    desc: "kill after save_now(session), before grant_access → restart"
    fault: none
    kill_at: post_session
    invariants: [I2, I4, I5, I7]
    venue: {host: yes, qemu: yes}
  - id: pay-kill-post-gate-pre-response
    desc: "kill after the gate opens, before the HTTP response → customer retries"
    fault: none
    kill_at: post_gate
    invariants: [I2, I6, I7]
    venue: {host: yes, qemu: yes}

  # ── swap ambiguity ───────────────────────────────────────────────────
  - id: swap-timeout-drop-response
    subset: fast
    desc: "mint accepts the swap; proxy drops the response; backend times out → client retry behavior"
    fault: {route: "/v1/swap", mode: drop_response_after_forward, delay_before_drop: 2}
    invariants: [I1, I3, I4, I6, I7]
    venue: {host: yes, qemu: yes}
  - id: swap-timeout-then-restart
    desc: "swap accepted, response dropped → kill backend → restart with a healthy mint"
    fault: {route: "/v1/swap", mode: drop_response_after_forward, delay_before_drop: 2}
    kill_at: post_timeout
    invariants: [I1, I3, I4, I5, I7]
    venue: {host: yes, qemu: yes}

  # ── duplicates ───────────────────────────────────────────────────────
  - id: duplicate-post-sequential
    subset: fast
    desc: "same token POSTed twice sequentially after success"
    fault: none
    invariants: [I2, I6]
    venue: {host: yes, qemu: yes}
  - id: duplicate-post-concurrent
    subset: fast
    desc: "same token POSTed twice concurrently"
    fault: none
    invariants: [I2, I3, I6]
    venue: {host: yes, qemu: yes}

  # ── mint identity variation ──────────────────────────────────────────
  - id: mint-url-trailing-slash
    subset: fast
    desc: "config mint URL carries a trailing slash; token does not (and vice versa)"
    fault: none
    config_variation: trailing_slash
    invariants: [I1, I6]
    venue: {host: yes, qemu: yes}
  - id: mint-url-host-case
    subset: fast
    desc: "config mint host uppercase; token host lowercase"
    fault: none
    config_variation: host_case
    invariants: [I1, I6]
    venue: {host: yes, qemu: yes}

  # ── mint fault bursts ────────────────────────────────────────────────
  - id: mint-429-burst
    desc: "mint answers 429 to checkstate/swap for a burst, then recovers"
    fault: {route: "any", mode: status, status: 429, count: 5}
    invariants: [I1, I4, I6]
    venue: {host: yes, qemu: yes}
  - id: mint-500-burst
    desc: "mint answers 500 for a burst, then recovers"
    fault: {route: "any", mode: status, status: 500, count: 3}
    invariants: [I1, I4, I6]
    venue: {host: yes, qemu: yes}
  - id: mint-dns-failure
    desc: "mint hostname unresolvable for a window, then recovers"
    fault: {mode: dns_blackhole, duration: 10}
    invariants: [I4, I6]
    venue: {host: partial, qemu: yes}
  - id: mint-delayed-30s
    desc: "mint responses delayed beyond the backend's op timeout"
    fault: {route: "/v1/swap", mode: delay, delay: 45}
    invariants: [I1, I4, I5, I7]
    venue: {host: yes, qemu: yes}

  # ── mint lifecycle ───────────────────────────────────────────────────
  - id: mint-restart-between-quote-and-mint
    desc: "/ln-invoice quote created; mint restarts before mint_tokens"
    fault: {mode: mint_restart, at: after_quote}
    invariants: [I1, I4, I7]
    venue: {host: yes, qemu: yes}
  - id: keyset-rotation-held-balance
    desc: "wallet holds balance; mint rotates keyset; payment + payout afterwards"
    fault: {mode: keyset_rotation}
    invariants: [I1, I5, I6]
    venue: {host: pending-venue, qemu: pending-venue}
    note: "requires a rotating mint (cdk-mintd fakewallet has no rotation knob) — the tmbr #13 cloud-lab lane"
  - id: keyset-rotation-with-expiry
    desc: "as above but the retired keyset carries final_expiry"
    fault: {mode: keyset_rotation, final_expiry: true}
    invariants: [I1, I5, I6]
    venue: {host: pending-venue, qemu: pending-venue}
    note: "same venue dependency as keyset-rotation-held-balance"

  # ── full-router / payout ─────────────────────────────────────────────
  - id: router-reboot-pending-payment
    desc: "payment in flight; full router (VM) reboots"
    fault: none
    kill_at: vm_reboot
    invariants: [I1, I4, I7]
    venue: {host: no, qemu: yes}
  - id: partial-drain-two-mints
    desc: "drain across 2 mints; the second fails mid-drain"
    fault: {route: "/v1/swap", mode: status, status: 500, count: 1, when: "second_mint"}
    invariants: [I1, I4]
    venue: {host: yes, qemu: yes}
  - id: payout-failure-after-owner-paid
    desc: "owner melt succeeds; maintainer melt fails"
    fault: {mode: lnurl_unreachable, when: "maintainer"}
    invariants: [I1, I4]
    venue: {host: partial, qemu: yes}
  - id: hard-power-loss
    desc: "QEMU quit without shutdown while a payment is in flight"
    fault: none
    kill_at: qemu_quit
    invariants: [I1, I4, I5, I7]
    venue: {host: no, qemu: yes}

# Backend declarations — the differential axis.
backends:
  - key: rust-basic
    repo: Amperstrand/tollgate-module-basic-rust
    host_runner: supported
  - key: go
    repo: OpenTollGate/tollgate-module-basic-go
    host_runner: supported
  - key: rust
    repo: Amperstrand/tollgate-rs-ai-research-and-experiments
    host_runner: pending
